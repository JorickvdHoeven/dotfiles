# ─────────────────────────────────────────────────────────────
# tmux configuration — XDG location: ~/.config/tmux/tmux.conf
# Managed with TPM (Tmux Plugin Manager).
# Install plugins:  prefix + I
# Update plugins:   prefix + U
# Uninstall:        prefix + alt + u
# ─────────────────────────────────────────────────────────────

# ── Prefix: Ctrl-q (instead of default Ctrl-b) ──────────────
# Ctrl-q is legacy XON (flow-control resume); modern shells ignore it,
# so it's effectively free and avoids conflicts with readline (C-a, C-w, C-x)
# and signals (C-z, C-s).
unbind C-b
set -g prefix C-q
bind C-q send-prefix   # press Ctrl-q twice to send a literal Ctrl-q

# ── Core behaviour ──────────────────────────────────────────
set -g mouse on
set -g allow-passthrough on
set -g display-panes-time 10000
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000

# True-color + italics support for modern terminals (Ghostty, iTerm2, etc.)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# 1-based indexing reads more naturally than 0-based
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Pane borders ────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-format " [#P] #{pane_current_command} - [#T] "
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g window-style "bg=colour236,fg=colour245"
set -g window-active-style "bg=black,fg=white"

# ── Status bar ──────────────────────────────────────────────
set -g status-position top

# Reload config with `prefix + r`
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Command-mode visibility ─────────────────────────────────
# `message-style`         = how `display-message` (status notifications) look.
# `message-command-style` = how the `:` command prompt looks while you type.
# Bold + bright background makes the prompt impossible to miss vs the rest of
# the status line.
set -g message-style          "bg=#292e42,fg=#c0caf5,bold"
set -g message-command-style  "bg=#e0af68,fg=#24283b,bold"

# ── Floating command prompt ─────────────────────────────────
# Native `command-prompt` can't be popped up directly; this wraps `read` in a
# popup and forwards the input to tmux. Lose tmux tab-completion; gain a
# centered floating box.
#   prefix + :   → floating popup prompt (new)
#   prefix + ;   → classic status-bar command prompt (with completion)
bind ':' display-popup -E -w 60% -h 3 -T ' tmux command ' \
  "bash -c 'read -ep \"tmux> \" cmd && [ -n \"\$cmd\" ] && tmux \$cmd'"
bind ';' command-prompt

# ── Plugins (managed by TPM) ────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Prefix highlight: shows [PREFIX] / [COPY] / [SYNC] in the status bar.
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt   'COPY'
set -g @prefix_highlight_sync_prompt   'SYNC'
set -g @prefix_highlight_fg            '#1a1b26'
set -g @prefix_highlight_bg            '#e0af68,bold'
set -g @prefix_highlight_copy_mode_attr 'fg=#1a1b26,bg=#e0af68,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=#1a1b26,bg=#7aa2f7,bold'
set -g @prefix_highlight_output_prefix  ' '
set -g @prefix_highlight_output_suffix  ' '

# tmux-menus: open with `prefix + M` (Shift+m).
# Note: `\` would conflict with tmux-pain-control's split-window binding.
set -g @menus_trigger 'M'
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'

# Tokyo Night theme (the plugin rebranded to "PowerKit" — uses @powerkit_* now).
set -g @plugin 'fabioluciano/tmux-tokyo-night'

# Theme + variant. PowerKit's default is catppuccin/mocha, so we MUST select
# tokyo-night explicitly. Available tokyo-night variants: night | storm | day.
# (The old "moon" variation no longer exists in PowerKit; "storm" is closest.)
# Custom theme = tokyo-night/storm but with a DYNAMIC statusbar-bg (dark normally,
# mode-color on prefix) so the whole bar — caps included — flashes on prefix with
# no notch. See ~/.config/tmux/powerkit-custom.sh.
set -g @powerkit_theme 'custom'
set -g @powerkit_custom_theme_path '~/.config/tmux/powerkit-custom.sh'
# NOTE: do NOT set @powerkit_plugins unless you want to REPLACE the whole right
# bar — setting it to a single value wipes the default clock/battery/cpu/mem/host.

# Window tabs = rounded pills. Use the MAIN separator style 'rounded' (same safe
# mechanism as the default chevrons, just curved) + per-window spacing for gaps.
# NOTE: avoid '@powerkit_edge_separator_style rounded:all' — the ':all' per-window
# code path is buggy in this build and collapses the window list to empty.
set -g @powerkit_separator_style 'rounded'
set -g @powerkit_elements_spacing 'windows'

# Session save/restore (continuum auto-saves every 15 min)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── Bootstrap TPM + plugins (auto-install on first run) ─────
# Delegates to install-plugins.sh, which clones TPM and every @plugin with
# retries + shallow depth. The old inline `git clone && install_plugins` had no
# retry, so a single network blip left you half-installed with no feedback
# (e.g. the theme plugin silently failing → broken status bar on a fresh Mac).
# Run manually any time:  ~/.config/tmux/install-plugins.sh   (--force to reset)
if "test ! -d ~/.config/tmux/plugins/tpm || test ! -d ~/.config/tmux/plugins/tmux-tokyo-night" \
   "run -b '~/.config/tmux/install-plugins.sh > ~/Library/Logs/tmux-install.log 2>&1'"

# Keep this line at the very bottom of the file.
run '~/.config/tmux/plugins/tpm/tpm'

# ── Two-line status bar (must run AFTER tpm/theme load) ─────
# Tokyo Night owns line 0; line 1 is a blank-but-tinted strip used as the
# prefix-mode indicator.
set -g status 2
set -g status-interval 1

# Bar background uses the SAME dynamic expression as the custom theme's
# statusbar-bg, so the bar, the pill caps, and line 1 all flash together on
# prefix with no mismatch: dark #1a1b26 normally, #e0af68 while prefix is held.
#   #{?client_prefix,A,B}   →  A while prefix is active, B otherwise
set -g status-style          "bg=#{?client_prefix,#b38c53,#1a1b26},fg=#c0caf5"
set -g 'status-format[1]'    "#[bg=#{?client_prefix,#b38c53,#1a1b26}]"
